<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Login Clone</title>
</head>
<body>
    <div style="text-align: center;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" height="100" alt="Amazon Logo"/>
        <div>
            <p><strong>Sign In</strong></p>
        </div>

        <label for="email">
            <strong>Email (phone for mobile account)</strong>
            <br>
            <input type="email" name="email" id="email">
        </label>
        <br><br>
        
        <label for="password">
            <strong>Password</strong>
            <span><a href="#">Forget your password?</a></span>
            <br>
            <input type="password" name="password" id="password">
        </label>
        <br><br>

        <div>
            <a href="project1.html">Login</a> | 
            <a href="sign in.html" target="_self">Sign In</a>
        </div>
        <br>

        <div>
            <h2>New to Amazon?</h2>
            <button name="NewAccount">Create your Amazon account</button>
        </div>
        <br>

        <hr>

        <div>
            <p>
                <a href="#">Conditions of Use</a> | 
                <a href="#">Notice of Use</a> | 
                <a href="#">Help</a>
            </p>
        </div>
    </div>
</body>
</html>
