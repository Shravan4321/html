<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <center>
        <body bgcolor="black" text="white"></body>
        <h5>Student Registration Form</h5>
        <form>

            <table border="1"cellspacing="10">
                <tr>
                    <th>
                        <label for="Name">Name:</label>
                        <td>
                            <input type="txt"placeholder="Enter the first Name">
                            <input type="txt"placeholder="Enter the last name">
                        </td>
                    </th>
                </tr>
                <tr>
                    <th>
                        <lable for="Email">Emali:</lable>
                        <label for="password">password</label>
                        <td>
                            <input type="Email"placeholder="Enter user email">
                            <input type="password"placeholder="enter the email password">
                        </td>
                    </th>
                </tr>
                <tr>
                    <th>
                        <label for="Address">Address</label>
                    </th>
                    <td>
                        <input type="Address"placeholder="street Address">
                        <input type="Address"placeholder="street Address line 2">
                    </td>
                </tr>
                <tr>
                    <th>
                        <label type="Select Your City">Select Your City</label>
                    </th>
                    <td>
                        <select Name="city">
                        <option value="Samastipur">Samastipur</option>
                        <option value="Bareilly">Bareilly</option>
                        <option value="Ranchi">Ranchi</option>
                        <option value="Shimla">Shimla</option>
                        <option value="Telangana">Telangana</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="Select your State">Select your State</label>
                    </th>
                    <td>
                        <select Name="state">
                            <option value="Bihar">Bihar</option>
                            <option value="Uttar Pradesh">Uttar Pradesh</option>
                            <option value="Jharkhand">Jharkhand</option>
                            <option value="Himachal Pradesh">Himachal Pradesh</option>
                            <option value="Hyderabad">Hyderabad</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="Select Your Country">Select your Country</label>
                    </th>
                    <td>
                        <select Name="Country">
                            <option value="India">India</option>
                            <option value="Amrica">Amrica</option>
                            <option value="Indonesia">Indonesia</option>
                            <option value="Ireland">Ireland</option>
                            <option value="England">England</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="Phone Number">Phone Number</label>
                    </th>
                    <td>
                        <input type="Phone Number" placeholder=" 91 Phone Number">
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="select your course">Select Your Course</label>
                    </th>
                    <td>
                        <select Course="Course">
                            <option value="BCA">BCA</option>
                            <option value="Arts">Arts</option>
                            <option value="science">science</option>
                            <option value="Commerce">Commerce</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="Date of Birth">Date of Birth</label>
                    </th>
                    <td>
                        <input type ="Date of Birth" placeholder="mm-DD-YY">
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="Select Your Gender">Select Your Gender</label>
                    </th>
                    <td>
                        <input type="radio" value=" Male"Name="Gender"> Male
                        <input type="radio" value="Female"Name="Gender">female
                        <input type="radio" value="Other"Name="Gender">Other
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="Your Religion">Your Religion</label>
                    </th>
                    <td>
                        <input type="Your Religion" placeholder="Enter the User Registion">
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="Your Signature">Your Signature</label>
                    </th>
                    <td>
                        <input type="Signature" placeholder="Your Signature">
                    </td>
                </tr>
                <tr>
                <th>
                    <label for="feedback">Form  Of Feedback</label>
                </th>
                <td>
                    <textarea Name="Feedback" id="Feedback" placeholder="Please Add feedback"> Please Add Feedback</textarea>
                </td>
              </tr>
              <tr>
                <th>
                <label for="submit">Form submit</label>
                </th>
                <td>
                    <input type="Submit" value="Submit">
                </td>
              </tr>
            </table>
        </form>
    </center>
    
</body>
</html>
